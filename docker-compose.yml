version: '3.8'

services:
  blackbarr:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: blackbarr
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TARGET_SERVER_URL=http://jellyfin:8096
      - PORT=8080
      - SCAN_DIRECTORIES=/media/movies, /media/tv
      - BLACKBARR_DB_PATH=/config/BlackBarr.db
    volumes:
      - ./config:/config
      - /path/to/movies:/media/movies:ro
      - /path/to/tv:/media/tv:ro
      # Optional: Mount target Jellyfin/Emby server config folder to enable auto-injection of ffmpeg-wrapper
      - /path/to/jellyfin/config:/target-jellyfin-config:rw

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - /path/to/jellyfin/config:/config
      - /path/to/movies:/media/movies:ro
      - /path/to/tv:/media/tv:ro
    depends_on:
      - blackbarr
