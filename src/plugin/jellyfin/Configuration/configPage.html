<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BlackBarr Helper Configuration</title>
</head>
<body>
    <div id="BlackBarrHelperConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="BlackBarrHelperConfigForm">
                    <div class="sectionTitleContainer flex align-items-center flex-grow">
                        <h2 class="sectionTitle">BlackBarr Helper Options</h2>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel" for="txtBlackBarrUrl">BlackBarr API Server URL:</label>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <input id="txtBlackBarrUrl" name="txtBlackBarrUrl" type="text" is="emby-input" required style="flex: 1;" />
                            <button type="button" id="btnTestConnection" is="emby-button" class="raised button-accent" style="margin: 0; white-space: nowrap;">
                                <span>Test Connection</span>
                            </button>
                        </div>
                        <div class="fieldDescription">Base URL of your BlackBarr container as reached by Jellyfin (e.g. http://127.0.0.1:6795).</div>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withFieldDescription">
                        <label>
                            <input id="chkForceTranscodeCropped" name="chkForceTranscodeCropped" type="checkbox" is="emby-checkbox" />
                            <span>Force Transcode Cropped Media</span>
                        </label>
                        <div class="fieldDescription">Automatically force transcoding for items with detected black bar crops.</div>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withFieldDescription">
                        <label>
                            <input id="chkForceTranscodeAll" name="chkForceTranscodeAll" type="checkbox" is="emby-checkbox" />
                            <span>Force Transcode ALL Streams</span>
                        </label>
                        <div class="fieldDescription">Globally force transcoding on all playback sessions across this Jellyfin server.</div>
                    </div>

                    <div style="margin-top: 1.5em;">
                        <button is="emby-button" type="submit" class="raised button-submit block"><span>Save</span></button>
                    </div>
                </form>
            </div>
        </div>

        <script type="text/javascript">
            (function () {
                const pluginId = 'b598b9e4-6a2c-476b-9c71-2191419736c4';

                document.querySelector('#BlackBarrHelperConfigPage').addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        document.querySelector('#txtBlackBarrUrl').value = config.BlackBarrUrl || 'http://127.0.0.1:6795';
                        document.querySelector('#chkForceTranscodeCropped').checked = config.ForceTranscodeCropped !== false;
                        document.querySelector('#chkForceTranscodeAll').checked = config.ForceTranscodeAll === true;
                        Dashboard.hideLoadingMsg();
                    });
                });

                document.querySelector('#btnTestConnection').addEventListener('click', function () {
                    const baseUrl = document.querySelector('#txtBlackBarrUrl').value.trim();

                    Dashboard.showLoadingMsg();
                    ApiClient.ajax({
                        type: 'GET',
                        url: ApiClient.getUrl('BlackBarr/TestConnection?Url=' + encodeURIComponent(baseUrl))
                    }).then(function (result) {
                        Dashboard.hideLoadingMsg();
                        var resData = result;
                        if (typeof result === 'string') {
                            try { resData = JSON.parse(result); } catch (e) {}
                        }
                        var isSuccess = resData && (resData.Success === true || resData.success === true);
                        var body = resData ? (resData.Message || resData.message || JSON.stringify(resData)) : 'No response from server.';
                        var finalMsg = isSuccess ? ('✅ SUCCESS: ' + body) : ('❌ FAILED: ' + body);
                        Dashboard.alert(finalMsg);
                    }).catch(function (err) {
                        Dashboard.hideLoadingMsg();
                        var msg = (err && err.responseText) ? err.responseText : (err ? (err.message || JSON.stringify(err)) : 'Unknown error');
                        Dashboard.alert('❌ FAILED to communicate with Jellyfin backend: ' + msg);
                    });
                });

                document.querySelector('#BlackBarrHelperConfigForm').addEventListener('submit', function (e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                        config.BlackBarrUrl = document.querySelector('#txtBlackBarrUrl').value;
                        config.ForceTranscodeCropped = document.querySelector('#chkForceTranscodeCropped').checked;
                        config.ForceTranscodeAll = document.querySelector('#chkForceTranscodeAll').checked;

                        ApiClient.updatePluginConfiguration(pluginId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });
                    return false;
                });
            })();
        </script>
    </div>
</body>
</html>
